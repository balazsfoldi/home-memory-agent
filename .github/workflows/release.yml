name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to prepare, without the leading v (for example 1.0.0)
        required: true
        type: string
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  prepare-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Ensure releases start from main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run the release workflow from the main branch."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update all project versions
        run: node scripts/set-version.mjs "$RELEASE_VERSION"
      - name: Create release branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="release/v${RELEASE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- package.json package-lock.json apps/api/package.json apps/web/package.json packages/shared/package.json README.md docs/architecture.md apps/web/src/App.tsx
          git commit -m "chore(release): prepare v${RELEASE_VERSION}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(release): prepare v${RELEASE_VERSION}" \
            --body "This PR prepares Home Memory Agent v${RELEASE_VERSION}. Merge it after the required CI checks pass; the release workflow will then tag the merge commit and publish the multi-platform image."
          gh workflow run ci.yml --ref "$branch"

  publish-release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate release version and create tag
        id: release
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")"
          tag="v${version}"
          if [[ "$RELEASE_BRANCH" != "release/$tag" ]]; then
            echo "Merged release branch does not match package version $version."
            exit 1
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The package version is not a stable MAJOR.MINOR.PATCH version."
            exit 1
          fi
          remote_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [[ -n "$remote_tag" ]]; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            if [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag already points to a different commit."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=Home Memory Agent
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" --title "Home Memory Agent ${{ steps.release.outputs.tag }}" --generate-notes
