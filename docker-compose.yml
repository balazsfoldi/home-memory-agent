services:
  home-memory-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/balazsfoldi/home-memory-agent:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_PATH: /app/data
    ports:
      - '127.0.0.1:${HOST_PORT:-3000}:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - home-memory-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  home-memory-data:
